# nginx de Osmoguard: sirve la PWA y hace de proxy inverso hacia la API.
server_tokens off;

map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 128k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # URL pública del túnel rápido de Cloudflare (metadatos de cloudflared, sin datos sensibles).
  location = /_tunnel {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $tunnel_upstream http://tunnel:2000;
    proxy_pass $tunnel_upstream/quicktunnel;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;
    # La API define sus propias cabeceras; nunca se cachean respuestas con datos clínicos o tokens.
    add_header Cache-Control "no-store" always;
  }

  # Recursos con hash: caché inmutable.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker, manifest e index: siempre revalidar para actualizaciones controladas.
  location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Fallback SPA.
  location / {
    try_files $uri /index.html;
  }
}
